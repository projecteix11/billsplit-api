name: Deploy API

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/**'

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v6

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: ⚙️ Install dependencies
        run: pip install -r requirements.txt

      - name: 🧪 Run tests
        run: pytest

  notify:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: 📨 Notify Discord
        # Untrusted input (commit message) must reach the shell only via env,
        # never via ${{ }} interpolation inside `run` (script injection).
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          FIRST_LINE=$(printf '%s\n' "$COMMIT_MSG" | head -1)
          jq -n --arg msg "$FIRST_LINE" \
            '{content: ("# ⚠️ GIT PULL API\n- " + $msg)}' \
            | curl -sS -X POST "$WEBHOOK" \
              -H "Content-Type: application/json" \
              -d @-
